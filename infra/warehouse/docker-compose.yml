name: stylesphere-warehouse

# Warehouse PostgreSQL for StyleSphere (synthetic data only).
# Run from the repository root:
#   docker compose --env-file .env -f infra/warehouse/docker-compose.yml up -d

services:
  warehouse:
    image: postgres:16
    container_name: stylesphere-warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-stylesphere}
      POSTGRES_USER: ${WAREHOUSE_ADMIN_USER:-stylesphere_admin}
      POSTGRES_PASSWORD: ${WAREHOUSE_ADMIN_PASSWORD:?Set WAREHOUSE_ADMIN_PASSWORD in .env}
      WRITER_USER: ${WAREHOUSE_WRITER_USER:-stylesphere_writer}
      WRITER_PASSWORD: ${WAREHOUSE_WRITER_PASSWORD:?Set WAREHOUSE_WRITER_PASSWORD in .env}
      READER_USER: ${WAREHOUSE_READER_USER:-stylesphere_reader}
      READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:?Set WAREHOUSE_READER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-5433}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  warehouse-data:
